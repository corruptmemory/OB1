root = "."
tmp_dir = "tmp"

[build]
cmd = "./build.sh build"
bin = "./open-brain-dashboard-go"
args_bin = ["serve", "--config", "open-brain-dashboard-go.toml"]
include_ext = ["go", "templ", "toml", "css", "js"]
exclude_dir = ["tmp", "static/vendor"]
exclude_regex = ["_test.go", "_templ.go"]
kill_delay = "500ms"

[screen]
clear_on_rebuild = true
